[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "github-community-agent"
version = "0.0.0.dev0"
description = "Independent GitHub community management agent (pre-release)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1"]

[project.scripts]
github-community-agent-read = "github_community_agent.read_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
